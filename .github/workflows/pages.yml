# Vérifie que les pages générées (racine en anglais, /fr/ en français, sitemap) correspondent bien
# aux modèles de src/ et aux textes de site.js. En cas d'échec : node tools/build.mjs, puis committer.
name: Pages à jour
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tools/build.mjs
      - run: git diff --exit-code || { echo "Pages pas à jour : lancer node tools/build.mjs et committer."; exit 1; }
